[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldreforge"
version = "0.1.0.dev0"
description = "WorldReforge single-GPU Nano inference and video evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "scikit-image>=0.22"]

[project.scripts]
worldreforge = "worldreforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
worldreforge = ["resources/*.json"]
